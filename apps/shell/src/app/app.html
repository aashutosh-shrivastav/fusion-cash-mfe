<!-- Shell Layout: Topbar + Main Content + Overlay Sidebar + Blurry Backdrop -->
<div class="shell-layout">

  <!-- Topbar Component (Shared UI) -->
  <fc-topbar
    [title]="title"
    [logoUrl]="logoUrl()"
    [currentDateTime]="currentDateTime()"
    [isDark]="isDark"
    (toggleSidebar)="toggleSidebar()"
    (toggleTheme)="toggleTheme()">
  </fc-topbar>

  <!-- Main Content + Footer Component (Shared UI) -->
  <div class="shell-main">
    <main class="shell-content">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer Component (Shared UI) -->
    <fc-footer></fc-footer>
  </div>

  <!-- Blurry Backdrop Overlay (appears when sidebar is open) -->
  @if (sidebarOpen()) {
    <div
      class="shell-backdrop"
      (click)="closeSidebar()"
      aria-hidden="true">
    </div>
  }

  <!-- Overlay Sidebar Drawer (Overlaps topbar from top: 0, left: 0) -->
  <aside
    class="shell-sidebar"
    [class.open]="sidebarOpen()"
    aria-label="Sidebar navigation">
    
    <!-- Drawer Header with full-width centered logo and centered title below -->
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <img [src]="sidebarLogoUrl()" alt="Tech Mahindra Logo" class="sidebar-brand-logo" />
        <span class="brand-title">Fusion Portal</span>
      </div>
    </div>

    <!-- Drawer Navigation Content -->
    <div class="sidebar-menu-wrapper">
      <fc-sidebar-menu
        [menuItems]="menuItems"
        [collapsed]="false"
        (menuItemClicked)="closeSidebar()">
      </fc-sidebar-menu>
    </div>
  </aside>

</div>
