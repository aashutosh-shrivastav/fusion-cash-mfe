openapi: 3.0.3
info:
  title: Dummy Microservice API
  description: Example additional OpenAPI 3.0 Specification to test multi-spec codegen
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1/dummy

paths:
  /notifications:
    get:
      summary: Get user notifications
      operationId: getNotifications
      responses:
        '200':
          description: List of system notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationItem'

components:
  schemas:
    NotificationItem:
      type: object
      required:
        - id
        - title
        - message
        - isRead
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
